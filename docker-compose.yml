services:
  switchyard:
    build: .
    ports:
      - "4567:4567"
    volumes:
      # All persistent data (sessions, settings, agents, recordings, envs, webhooks)
      - switchyard-data:/home/switchyard/.switchyard
    environment:
      - NODE_ENV=production
      - PORT=4567
    restart: unless-stopped

volumes:
  switchyard-data:
